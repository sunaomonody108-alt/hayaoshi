<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>早押しボタン</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#111827; --panel:#1f2937; --text:#f9fafb; --muted:#9ca3af; --accent:#f59e0b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; }
  button { font:inherit; cursor:pointer; }
  .hidden { display:none !important; }
  .status { position:fixed; top:8px; right:12px; font-size:13px; color:var(--muted); }
  .status.ok::before { content:"● "; color:#22c55e; }
  .status.ng::before { content:"● "; color:#ef4444; }

  /* 準備画面 */
  #setup { max-width:560px; margin:0 auto; padding:24px 16px; }
  #setup h1 { font-size:28px; }
  #setup label { display:block; margin:12px 0 4px; color:var(--muted); }
  #setup input, #setup select { width:100%; padding:10px; font-size:18px; border-radius:8px; border:1px solid #374151; background:var(--panel); color:var(--text); }
  .row { display:flex; gap:8px; align-items:center; }
  .row .chip { width:20px; height:20px; border-radius:50%; flex:none; }
  .btn { padding:14px 20px; font-size:20px; border:none; border-radius:10px; background:var(--accent); color:#111; font-weight:700; }
  .btn.sub { background:#374151; color:var(--text); font-weight:400; font-size:16px; padding:10px 14px; }
  .note { color:var(--muted); font-size:14px; line-height:1.6; }

  /* 司会画面 */
  #host { padding:16px; max-width:1100px; margin:0 auto; }
  #host header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  #roundLabel { font-size:28px; font-weight:700; }
  #ranking { margin-top:16px; display:flex; flex-direction:column; gap:12px; min-height:50vh; }
  .rank { display:flex; align-items:center; gap:20px; padding:18px 24px; border-radius:14px; background:var(--panel); font-size:32px; }
  .rank .pos { font-size:40px; font-weight:800; width:90px; }
  .rank .name { flex:1; font-weight:700; }
  .rank .diff { color:var(--muted); font-size:24px; }
  .rank.first { font-size:56px; padding:28px 24px; outline:6px solid var(--accent); }
  .rank.first .pos { font-size:64px; width:140px; }
  .close { color:var(--accent); font-size:18px; margin-left:8px; }
  .waiting { color:var(--muted); font-size:28px; text-align:center; margin-top:15vh; }
  #qrPanel { margin-top:24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .qrCard { background:#fff; color:#111; border-radius:12px; padding:16px; text-align:center; }
  .qrCard .tname { font-size:22px; font-weight:800; margin-bottom:8px; }
  .qrCard .qr { display:flex; justify-content:center; }
  .qrCard a { font-size:11px; word-break:break-all; color:#555; }

  /* チーム(スマホ)画面 */
  #player { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:16px; }
  #pTeam { font-size:32px; font-weight:800; text-align:center; }
  #pButton { width:min(78vw,78vh); height:min(78vw,78vh); max-width:420px; max-height:420px; border-radius:50%;
    border:10px solid rgba(255,255,255,.85); font-size:48px; font-weight:900; color:#fff;
    box-shadow:0 14px 0 rgba(0,0,0,.35); touch-action:manipulation; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; }
  #pButton:active { transform:translateY(8px); box-shadow:0 6px 0 rgba(0,0,0,.35); }
  #pButton:disabled { filter:grayscale(.8) brightness(.6); transform:none; box-shadow:none; }
  #pMsg { font-size:22px; text-align:center; min-height:2em; }
</style>
</head>
<body>

<div id="status" class="status hidden"></div>

<!-- 準備画面 -->
<section id="setup" class="hidden">
  <h1>早押しボタン 準備</h1>
  <label>チーム数</label>
  <select id="teamCount"></select>
  <div id="teamNames"></div>
  <label>通信方法</label>
  <select id="mode">
    <option value="net">本番(スマホから押す)</option>
    <option value="local">練習(このPCのタブ同士だけで試す)</option>
  </select>
  <p style="margin-top:24px"><button class="btn" id="startBtn">司会画面を開く</button></p>
  <p class="note">司会画面のURLをブックマークしておくと、ページを閉じても同じQRコードのまま再開できます。</p>
</section>

<!-- 司会画面 -->
<section id="host" class="hidden">
  <header>
    <div id="roundLabel">第1問</div>
    <div class="row">
      <button class="btn" id="resetBtn">次の問題へ(スペースキー)</button>
      <button class="btn sub" id="qrBtn">QRコードを隠す</button>
    </div>
  </header>
  <div id="ranking"></div>
  <div id="qrPanel"></div>
</section>

<!-- チーム画面 -->
<section id="player" class="hidden">
  <div id="pTeam"></div>
  <button id="pButton" disabled>押す!</button>
  <div id="pMsg">接続中…</div>
</section>

<script>
const COLORS = ["#ef4444","#3b82f6","#22c55e","#eab308","#a855f7","#f97316","#14b8a6","#ec4899"];
const DEFAULT_NAMES = ["Aチーム","Bチーム","Cチーム","Dチーム","Eチーム","Fチーム","Gチーム","Hチーム"];
const NTFY = "https://ntfy.sh/";
const CLOSE_MS = 150; // これより差が小さいと「僅差」と表示

const params = new URLSearchParams(location.search);
const room = params.get("room");
const isLocal = params.get("local") === "1";
const teamParam = params.get("team");
const $ = id => document.getElementById(id);

function setStatus(ok, text) {
  const s = $("status");
  s.classList.remove("hidden");
  s.className = "status " + (ok ? "ok" : "ng");
  s.textContent = text;
}

// ---- 通信(ntfy.sh か、練習用のBroadcastChannel) ----
// onMsg(obj) には自分が送ったものも届く。
function connect(onMsg, { replay }) {
  if (isLocal) {
    const bc = new BroadcastChannel("hayaoshi-" + room);
    bc.onmessage = e => onMsg(e.data);
    setStatus(true, "練習モード");
    return { send(obj) { bc.postMessage(obj); onMsg(obj); return Promise.resolve(); } };
  }

  let es = null, lastId = null, retry = null;
  function open() {
    if (es) es.close();
    const since = lastId || (replay ? "2h" : null);
    es = new EventSource(NTFY + room + "/sse" + (since ? "?since=" + since : ""));
    es.onopen = () => setStatus(true, "接続OK");
    es.onmessage = e => {
      let d; try { d = JSON.parse(e.data); } catch { return; }
      if (d.event !== "message") return;
      lastId = d.id;
      let obj; try { obj = JSON.parse(d.message); } catch { return; }
      onMsg(obj);
    };
    es.onerror = () => {
      setStatus(false, "再接続中…");
      es.close();
      clearTimeout(retry);
      retry = setTimeout(open, 1000);
    };
  }
  open();
  // iPhoneは画面を消すと接続が切れるので、戻ってきたらつなぎ直す
  document.addEventListener("visibilitychange", () => { if (!document.hidden) open(); });

  return {
    send(obj) {
      return fetch(NTFY + room, { method: "POST", body: JSON.stringify(obj) })
        .then(r => { if (!r.ok) throw new Error(r.status); })
        .catch(err => { setStatus(false, "送信失敗"); throw err; });
    }
  };
}

function teamsFromParams() {
  try { return JSON.parse(params.get("teams")); } catch { return null; }
}

function teamUrl(i, name) {
  const u = new URL(location.href.split("?")[0]);
  u.searchParams.set("room", room);
  u.searchParams.set("team", String(i));
  u.searchParams.set("name", name);
  if (isLocal) u.searchParams.set("local", "1");
  return u.toString();
}

// ---- 準備画面 ----
function showSetup() {
  $("setup").classList.remove("hidden");
  const sel = $("teamCount");
  for (let n = 2; n <= 8; n++) sel.add(new Option(n + "チーム", n, n === 4, n === 4));
  function drawNames() {
    const box = $("teamNames");
    const old = [...box.querySelectorAll("input")].map(i => i.value);
    box.innerHTML = "";
    for (let i = 0; i < +sel.value; i++) {
      const lab = document.createElement("label");
      lab.textContent = "チーム" + (i + 1) + " の名前";
      const row = document.createElement("div");
      row.className = "row";
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.style.background = COLORS[i];
      const inp = document.createElement("input");
      inp.value = old[i] || DEFAULT_NAMES[i];
      row.append(chip, inp);
      box.append(lab, row);
    }
  }
  sel.onchange = drawNames;
  drawNames();
  $("startBtn").onclick = () => {
    const names = [...$("teamNames").querySelectorAll("input")].map((i, k) => i.value.trim() || DEFAULT_NAMES[k]);
    const id = "hayaoshi-" + crypto.getRandomValues(new Uint32Array(2)).join("").slice(0, 14);
    const u = new URL(location.href.split("?")[0]);
    u.searchParams.set("room", id);
    u.searchParams.set("teams", JSON.stringify(names));
    if ($("mode").value === "local") u.searchParams.set("local", "1");
    location.href = u.toString();
  };
}

// ---- 司会画面 ----
function showHost() {
  const names = teamsFromParams() || DEFAULT_NAMES.slice(0, 4);
  $("host").classList.remove("hidden");
  const key = "hayaoshi-round-" + room;
  let round = +(localStorage.getItem(key) || 1);
  let presses = []; // {team, at}
  let audio = null;

  function beep() {
    try {
      audio = audio || new AudioContext();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "square"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.25, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.6);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.6);
    } catch {}
  }

  function render() {
    $("roundLabel").textContent = "第" + round + "問";
    const box = $("ranking");
    box.innerHTML = "";
    if (!presses.length) {
      box.innerHTML = '<div class="waiting">ボタン受付中…</div>';
      return;
    }
    const t0 = presses[0].at;
    presses.forEach((p, i) => {
      const div = document.createElement("div");
      div.className = "rank" + (i === 0 ? " first" : "");
      div.style.borderLeft = "16px solid " + COLORS[p.team];
      const pos = document.createElement("span"); pos.className = "pos"; pos.textContent = (i + 1) + "位";
      const nm = document.createElement("span"); nm.className = "name"; nm.textContent = names[p.team] || "?";
      div.append(pos, nm);
      if (i > 0) {
        const ms = p.at - t0;
        const df = document.createElement("span"); df.className = "diff";
        df.textContent = "+" + (ms / 1000).toFixed(2) + "秒";
        if (ms < CLOSE_MS) { const c = document.createElement("span"); c.className = "close"; c.textContent = "僅差"; df.append(c); }
        div.append(df);
      }
      box.append(div);
    });
  }

  const link = connect(msg => {
    if (msg.type === "hello") link.send({ type: "round", round });
    if (msg.type !== "buzz" || msg.round !== round) return;
    const t = msg.team | 0;
    if (t < 0 || t >= names.length || presses.some(p => p.team === t)) return;
    presses.push({ team: t, at: performance.now() });
    if (presses.length === 1) beep();
    render();
  }, { replay: false });

  function nextRound(advance) {
    if (advance) round++;
    localStorage.setItem(key, round);
    presses = [];
    render();
    link.send({ type: "round", round }).catch(() => {});
  }
  $("resetBtn").onclick = () => { beep(); nextRound(true); };
  document.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); $("resetBtn").click(); }
  });

  // QRコード
  const panel = $("qrPanel");
  names.forEach((n, i) => {
    const card = document.createElement("div");
    card.className = "qrCard";
    card.style.borderTop = "10px solid " + COLORS[i];
    const tn = document.createElement("div"); tn.className = "tname"; tn.textContent = n;
    const qr = document.createElement("div"); qr.className = "qr";
    const a = document.createElement("a"); a.href = teamUrl(i, n); a.target = "_blank"; a.textContent = a.href;
    card.append(tn, qr, a);
    panel.append(card);
    if (window.QRCode) new QRCode(qr, { text: teamUrl(i, n), width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
  });
  $("qrBtn").onclick = () => {
    panel.classList.toggle("hidden");
    $("qrBtn").textContent = panel.classList.contains("hidden") ? "QRコードを表示" : "QRコードを隠す";
  };

  nextRound(false); // 今の問題番号をスマホに知らせる
}

// ---- チーム画面 ----
function showPlayer() {
  const team = teamParam | 0;
  const name = params.get("name") || DEFAULT_NAMES[team];
  $("player").classList.remove("hidden");
  $("pTeam").textContent = name;
  document.body.style.background = COLORS[team];
  const btn = $("pButton");
  btn.style.background = COLORS[team];
  let round = null, pressedRound = null;

  function render() {
    if (round === null) { btn.disabled = true; $("pMsg").textContent = "司会の開始待ち…"; return; }
    if (pressedRound === round) { btn.disabled = true; btn.textContent = "済"; $("pMsg").textContent = "押しました!司会の画面を見てね"; return; }
    btn.disabled = false; btn.textContent = "押す!"; $("pMsg").textContent = "第" + round + "問";
  }

  const link = connect(msg => {
    if (msg.type === "round") { round = msg.round; render(); }
    if (msg.type === "buzz" && msg.team === team && msg.round === round) { pressedRound = round; render(); }
  }, { replay: true });

  // clickより速く反応するpointerdownで送る
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (btn.disabled || round === null) return;
    pressedRound = round;
    render();
    if (navigator.vibrate) navigator.vibrate(80);
    link.send({ type: "buzz", round, team }).catch(() => {
      pressedRound = null; render();
      $("pMsg").textContent = "送信に失敗しました。もう一度押してください";
    });
  });

  if (isLocal) link.send({ type: "hello" });
  render();
}

if (!room) showSetup();
else if (teamParam !== null) showPlayer();
else showHost();
</script>
</body>
</html>
